services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pacs
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pacs_dev_only}
    volumes:
      - pacs_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacs -d pacs"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pacs_pg:
