name: PACS prototype checks
on:
  push:
  pull_request:
jobs:
  node-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies without executing native build scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Unit tests (no DICOM modality or database)
        run: npm test
